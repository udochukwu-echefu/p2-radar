<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("radar.theme") || "dark"; } catch {}</script>
<style>
/* Clean, modern cards: soft surfaces, generous spacing, tinted status pills, one blue accent. */
:root, [data-theme="dark"] {
  color-scheme: dark;
  /* true neutral greys: no blue cast */
  --bg:      oklch(0.145 0 0);
  --card:    oklch(0.185 0 0);
  --card-2:  oklch(0.215 0 0);
  --card-3:  oklch(0.245 0 0);
  --line:    oklch(0.255 0 0);
  --line-2:  oklch(0.31 0 0);
  --text:    oklch(0.965 0 0);
  --text-2:  oklch(0.74 0 0);
  --text-3:  oklch(0.57 0 0);
  --accent:  oklch(0.64 0.17 258);
  --on-accent: oklch(0.99 0.002 258);
  --red:     oklch(0.70 0.17 25);
  --amber:   oklch(0.80 0.14 75);
  --blue:    oklch(0.72 0.12 250);
  --green:   oklch(0.76 0.13 155);
  --shadow:  0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-hover: 0 12px 32px -12px oklch(0 0 0 / 0.6);
  --tint: 16%;
}
[data-theme="light"] {
  color-scheme: light;
  --bg:      oklch(0.975 0.002 270);
  --card:    oklch(0.997 0.001 270);
  --card-2:  oklch(0.97 0.003 270);
  --card-3:  oklch(0.945 0.004 270);
  --line:    oklch(0.915 0.004 270);
  --line-2:  oklch(0.86 0.005 270);
  --text:    oklch(0.22 0.008 270);
  --text-2:  oklch(0.46 0.01 270);
  --text-3:  oklch(0.62 0.01 270);
  --accent:  oklch(0.56 0.19 258);
  --red:     oklch(0.56 0.2 25);
  --amber:   oklch(0.62 0.15 65);
  --blue:    oklch(0.52 0.15 255);
  --green:   oklch(0.56 0.13 155);
  --shadow:  0 1px 2px oklch(0.3 0.02 270 / 0.05), 0 1px 3px oklch(0.3 0.02 270 / 0.06);
  --shadow-hover: 0 14px 30px -12px oklch(0.3 0.02 270 / 0.2);
  --tint: 12%;
}
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.75, 0);
  --tb: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body { transition: background 240ms var(--ease), color 240ms var(--ease); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 15px; height: 15px; flex: none; }

/* ------------------------------------------------------------ toolbar */
.toolbar { position: sticky; top: 0; z-index: 30; height: var(--tb); background: color-mix(in oklch, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.tb { max-width: 1280px; height: 100%; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; letter-spacing: -0.01em; }
.brand .logo { width: 30px; height: 30px; display: block; flex: none; border-radius: 7px; box-shadow: 0 1px 2px oklch(0 0 0 / 0.35); }
.in-app .brand .name { display: none; }
.pills { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: auto; padding: 3px; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }
.pills button { position: relative; z-index: 1; border: 0; background: none; padding: 5px 14px; border-radius: 7px; color: var(--text-2); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: color 150ms var(--ease), background 150ms var(--ease); }
.pills button:hover { color: var(--text); }
.pills button[aria-selected="true"], .pills button[aria-pressed="true"] { color: var(--text); background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.pills .n { color: var(--text-3); font-weight: 400; font-size: 12px; }
.grow { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 34px; width: 240px; padding: 0 12px; border-radius: 9px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-3); transition: box-shadow 150ms var(--ease); }
.search:focus-within { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search kbd { font: 11px var(--font); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; }
.search:focus-within kbd { display: none; }
.view-other .search { visibility: hidden; }
.icon-btn { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 9px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); transition: background 140ms var(--ease), color 140ms var(--ease), transform 90ms var(--ease); }
.icon-btn:hover { background: var(--card-3); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
.theme svg { position: absolute; transition: opacity 200ms var(--ease), transform 320ms var(--ease); }
[data-theme="dark"] .theme .sun, [data-theme="light"] .theme .moon { opacity: 0; transform: rotate(-70deg) scale(0.5); }

main { max-width: 1280px; margin: 0 auto; padding: 32px 28px 120px; }

/* ------------------------------------------------------------ page header + stats */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.page-h h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 650; letter-spacing: -0.02em; }
.page-h p { margin: 4px 0 0; color: var(--text-2); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 30px; }
.stat { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); text-align: left; transition: border-color 160ms var(--ease), transform 200ms var(--ease), box-shadow 200ms var(--ease); }
button.stat:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-top { display: flex; align-items: center; gap: 10px; height: 30px; color: var(--text-2); font-weight: 500; line-height: 1.2; }
.chip { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--c, var(--text-2)); background: color-mix(in oklch, var(--c, var(--text-3)) var(--tint), transparent); }
.stat-v { margin-top: 12px; font-size: 26px; line-height: 1.1; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat-v small { font-size: 14px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 4px; }
.stat-s { margin-top: 4px; font-size: 12.5px; color: var(--text-3); }
.bar { height: 6px; border-radius: 99px; background: var(--card-3); overflow: hidden; margin-top: 11px; margin-bottom: 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--accent)); transform-origin: left; transform: scaleX(var(--f, 0)); transition: transform 420ms var(--ease); animation: grow 600ms var(--ease) both; }

.notice { margin: -10px 0 26px; padding: 12px 16px; border-radius: 12px; color: var(--text-2); background: color-mix(in oklch, var(--amber) var(--tint), var(--card)); border: 1px solid color-mix(in oklch, var(--amber) 30%, transparent); }
.notice code { font: 12px var(--mono); }

/* ------------------------------------------------------------ sections + cards */
.sec { margin-bottom: 34px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.count { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--card-2); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; line-height: 20px; }
.sec-h .hint { color: var(--text-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; align-items: start; }

.card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow);
  transition: border-color 160ms var(--ease), transform 220ms var(--ease), box-shadow 220ms var(--ease), opacity 200ms var(--ease); }
.card:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card.expanded { grid-column: 1 / -1; transform: none; }
.grid > *, .copies, .copies > li { min-width: 0; }
.card.busy { opacity: 0.55; pointer-events: none; }
.card:has(.menu.open) { z-index: 6; }
.card.flash { animation: flash 1.3s var(--ease); }
.card-top { display: flex; align-items: flex-start; gap: 8px; min-height: 26px; }
.card-top .tags { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.card-top .menu { flex: none; margin: -1px -4px 0 0; }
.card h3 { margin: 12px 0 0; font-size: 15px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .path { margin-top: 2px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 550; white-space: nowrap; flex: none;
  color: var(--c, var(--text-2)); background: color-mix(in oklch, var(--c, var(--text-3)) var(--tint), transparent); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain { color: var(--text-2); background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }

.prog { margin-top: 16px; }
.prog-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); }
.prog-h b { color: var(--text); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
.steps i { height: 6px; border-radius: 99px; background: var(--card-3); position: relative; overflow: hidden; }
.steps i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--c); transform-origin: left; transform: scaleX(0); transition: transform 420ms var(--ease); }
.steps i.on::after { transform: scaleX(1); animation: grow 520ms var(--ease) both; animation-delay: calc(var(--k) * 90ms); }
.steps-k { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; font-size: 11.5px; color: var(--text-3); }
.steps-k span.on { color: var(--text-2); }

.kv { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card-2); display: grid; gap: 6px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-weight: 550; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

.card-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.meta { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.meta svg { width: 13px; height: 13px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 9px; border: 0; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2);
  font-size: 13px; font-weight: 550; white-space: nowrap; position: relative; flex: none; transition: background 140ms var(--ease), transform 90ms var(--ease), filter 140ms var(--ease); }
.btn:hover { background: var(--card-3); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 2px oklch(0 0 0 / 0.2), inset 0 1px 0 oklch(1 0 0 / 0.12); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--red); color: oklch(0.99 0.003 25); box-shadow: none; }
.btn.danger:hover { filter: brightness(1.06); }
.btn.ghost { background: none; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--card-2); color: var(--text); }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.loading { color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--on-accent); border-right-color: transparent; animation: spin 0.7s linear infinite; }
.btn:not(.primary).loading::after { border-color: var(--text); border-right-color: transparent; }
.more { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--text-3); transition: background 140ms var(--ease), color 140ms var(--ease); }
.more:hover, .menu.open .more { background: var(--card-2); color: var(--text); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 550; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* menu */
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 230px; padding: 6px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2), 0 20px 44px -12px oklch(0 0 0 / 0.5);
  opacity: 0; transform: translateY(-4px) scale(0.97); transform-origin: top right; pointer-events: none; transition: opacity 120ms var(--ease), transform 120ms var(--ease); }
.menu.open .pop { opacity: 1; transform: none; pointer-events: auto; transition-duration: 180ms; }
.pop button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 13px; }
.pop button:hover { background: var(--card-2); }
.pop svg { color: var(--text-3); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }

/* inline panel */
.panel { margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--card-2); animation: reveal 260ms var(--ease); }
.panel h4 { margin: 0; font-size: 14px; font-weight: 600; }
.panel p { margin: 3px 0 12px; color: var(--text-2); }
.panel .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.panel .lab { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.panel .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.files { list-style: none; margin: 0; padding: 6px 0; max-height: 220px; overflow: auto; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font: 12px/1.65 var(--mono); }
.files li { display: flex; gap: 10px; padding: 0 12px; }
.files .s2 { color: var(--text-3); width: 18px; flex: none; }
.files .why { margin-left: auto; color: var(--red); white-space: nowrap; font-family: var(--font); font-size: 12px; }
.field { width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); font: 13px var(--mono); }
.field:focus { outline: 0; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent); }

/* copies */
.copies { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.copies > li { display: flex; flex-direction: column; gap: 7px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); }
.copies .p { font-size: 12.5px; overflow-wrap: anywhere; }
.copies .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.copies .copy-acts { order: 9; display: flex; gap: 6px; justify-content: flex-end; }

/* ------------------------------------------------------------ downloads */
.dl-grid { columns: 2 440px; column-gap: 16px; }
.dl-grid .card { break-inside: avoid; margin-bottom: 16px; }
.dl-grid .card:hover { transform: none; }
.cat-h { display: flex; align-items: center; gap: 10px; }
.cat-h h3 { margin: 0; font-size: 15px; }
.cat-h .link { margin-left: auto; }
.cat-hint { margin: 4px 0 8px; font-size: 12.5px; color: var(--text-3); }
.items { list-style: none; margin: 0 -8px; padding: 0; }
.item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px; border-radius: 10px; transition: background 120ms var(--ease); }
.item:hover { background: var(--card-2); }
.item input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.item .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .note { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .note.good { color: var(--green); }
.item .sz { font-size: 12.5px; color: var(--text-2); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.item .reveal { opacity: 0; transition: opacity 120ms var(--ease); }
.item:hover .reveal, .item:focus-within .reveal { opacity: 1; }
.more-row { padding: 6px 0 0; }

.actionbar { position: fixed; left: 50%; bottom: 20px; z-index: 30; width: min(700px, calc(100vw - 24px)); padding-bottom: env(safe-area-inset-bottom);
  transform: translate(-50%, calc(100% + 48px)); opacity: 0; visibility: hidden;
  transition: transform 340ms var(--ease), opacity 200ms var(--ease), visibility 0s 340ms; }
.view-cleanup .actionbar.ready { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform 340ms var(--ease), opacity 200ms var(--ease); }
.ab { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line-2); box-shadow: 0 20px 44px -14px oklch(0 0 0 / 0.45); }
.ab .total { flex: 1; min-width: 0; color: var(--text-2); }
.ab .total b { color: var(--text); font-weight: 600; }
.confirm { display: flex; gap: 8px; animation: reveal 200ms var(--ease); }

/* toast, skeleton, empty */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.view-cleanup .toasts { bottom: 92px; }
.toast { display: flex; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2), 0 16px 36px -12px oklch(0 0 0 / 0.45); font-size: 13px; animation: toast-in 240ms var(--ease); }
.toast.out { animation: toast-out 160ms var(--ease-in) forwards; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-top: 6px; flex: none; }
.toast.err i { background: var(--red); }
.skel { border-radius: 12px; background: linear-gradient(90deg, var(--card) 0%, var(--card-3) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-3); background: var(--card); border: 1px dashed var(--line-2); border-radius: 16px; }
.empty b { display: block; color: var(--text); font-size: 14.5px; margin-bottom: 2px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes reveal { from { opacity: 0; transform: translateY(-6px); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(4px); } }
@keyframes flash { 0%, 45% { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }

::view-transition-group(*) { animation-duration: 360ms; animation-timing-function: var(--ease); }
::view-transition-old(root) { animation: 120ms var(--ease-in) both fade-out; }
::view-transition-new(root) { animation: 240ms var(--ease) both fade-in; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
    animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ------------------------------------------------------------ responsive */
@media (max-width: 760px) {
  .tb { padding: 0 14px; gap: 8px; }
  .brand .name { display: none; }
  main { padding: 22px 14px 120px; }
  .search { width: 34px; padding: 0; justify-content: center; }
  .search input, .search kbd { display: none; }
  .search.open { position: absolute; left: 14px; right: 14px; width: auto; padding: 0 12px; justify-content: flex-start; z-index: 2; }
  .search.open input { display: block; }
  .page-h .pills { width: 100%; overflow-x: auto; scrollbar-width: none; }

};
const byRisk = (a, b) => b.risk - a.risk || (b.last_active || 0) - (a.last_active || 0);
const visible = () => S.proj.repos.filter(r => !S.hidden.has(r.path));
const active = () => visible().filter(r => !has(r, "stale"));
const slug = s => s.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || "project";

function filtered() {
  const v = visible();
  let list = {
    active: v.filter(r => !has(r, "stale")),
    attention: v.filter(r => !has(r, "stale") && laneOf(r).id !== "safe"),
    copies: v.filter(r => r.dup_group),
    old: v.filter(r => has(r, "stale")),
    hidden: S.proj.repos.filter(r => S.hidden.has(r.path)),
  }[S.filter];
  if (S.q) list = list.filter(r => (r.name + " " + r.display).toLowerCase().includes(S.q));
  return list;
}

function steps(r) {
  const done = [!r.dirty, !!r.remote, !!r.remote && !r.unpushed && r.has_commits];
  return { done, n: done.filter(Boolean).length };
}
function primary(r) {
  if (r.dirty) return ["commit", "Snapshot"];
  if (!r.remote && r.has_commits) return ["github", "Back up"];
  if (r.remote && (r.unpushed || has(r, "no-upstream"))) return ["push", "Push"];
  return null;
}
const fileList = (files, why) => `<ul class="files">${files.slice(0, 300).map(f =>
  `<li><span class="s2">${esc(f.status)}</span><span>${esc(f.path)}</span>${why ? `<span class="why">${esc(f.reason)}</span>` : ""}</li>`).join("")}${files.length > 300 ? `<li><span class="s2"></span><span>and ${files.length - 300} more</span></li>` : ""}</ul>`;

function panel(r) {
  const p = S.pending;
  if (!p || p.path !== r.path) return "";
  const cancel = `<button class="btn ghost" data-cancel>Cancel</button>`;
  if (p.type === "commit") return `<div class="panel"><h4>Snapshot on ${esc(r.branch || "this branch")}</h4><p>Saves these changes as one commit. Nothing is pushed.</p>
    <div class="cols"><div><div class="lab">Will commit (${p.preview.include.length})</div>${p.preview.include.length ? fileList(p.preview.include) : ""}</div>
    ${p.preview.exclude.length ? `<div><div class="lab">Held back (${p.preview.exclude.length})</div>${fileList(p.preview.exclude, true)}</div>` : ""}</div>
    <div class="acts">${cancel}<button class="btn primary" data-do="commit" ${p.preview.include.length ? "" : "disabled"}>Commit ${plural(p.preview.include.length, "file")}</button></div></div>`;
  if (p.type === "github") return `<div class="panel"><h4>Create a private GitHub repo</h4><p>Pushes your commits to a new private repository.${r.dirty ? " Uncommitted changes stay local, so snapshot first." : ""}</p>
    <div class="lab">Repository name</div><input class="field" id="ghname" value="${esc(slug(r.name))}">
    <div class="acts">${cancel}<button class="btn primary" data-do="github">Create and push</button></div></div>`;
  if (p.type === "trash_node_modules") return `<div class="panel"><h4>Move node_modules to the ${P.trash}?</h4><p>${plural(r.node_modules.length, "folder")}, ${human(r.node_modules_bytes)}. Running npm install brings them back.</p>
    <div class="acts">${cancel}<button class="btn danger" data-do="trash_node_modules">Move to ${P.trash}</button></div></div>`;
  return "";
}

function card(r) {
  const lane = laneOf(r);
  const st = steps(r);
  const p = primary(r);
  const hidden = S.hidden.has(r.path);
  const expanded = S.pending?.path === r.path;
  const menu = [
    `<button data-act="open" data-where="editor">${icon("code")}Open in ${S.proj.editor ? "VS Code" : "default app"}</button>`,
    `<button data-act="open" data-where="finder">${icon("folder")}Show in ${P.files}</button>`,
    `<button data-act="open" data-where="terminal">${icon("term")}Open in Terminal</button>`, `<hr>`,
    r.dirty ? `<button data-act="commit">${icon("save")}Snapshot changes</button>` : "",
    r.remote && r.has_commits ? `<button data-act="push">${icon("up")}Push</button>` : "",
    !r.remote && r.has_commits && S.proj.gh ? `<button data-act="github">${icon("cloud")}Back up to GitHub</button>` : "",
    r.node_modules.length ? `<button data-act="trash_node_modules">${icon("trash")}Move node_modules to ${P.trash}</button>` : "", `<hr>`,
    `<button data-act="${hidden ? "unhide" : "hide"}">${icon("eye")}${hidden ? "Show in Radar again" : "Hide from Radar"}</button>`,
  ].join("");
  const kv = [
    ["Uncommitted", r.dirty ? plural(r.dirty, "change") : "None"],
    [r.remote ? "Not pushed" : "Local commits", !r.has_commits ? "No commits yet" : r.unpushed ? plural(r.unpushed, "commit") : "None"],
    ["Remote", r.remote ? remoteName(r.remote_url) : "None"],
    r.node_modules_bytes > 50 * 1024 * 1024 && ["node_modules", human(r.node_modules_bytes)],
  ].filter(Boolean);
  return `<article class="card ${expanded ? "expanded" : ""} ${S.busy === r.path ? "busy" : ""}" data-path="${esc(r.path)}" style="view-transition-name:${vtName(r.path)}">
    <div class="card-top">
      <div class="tags">
        <span class="pill" style="--c:${lane.c}"><i></i>${lane.pill}</span>
        ${r.dup_group ? `<span class="pill plain">${r.dup_newest ? "Newest copy" : "Copy"}</span>` : ""}
        ${has(r, "stale") && S.filter !== "old" ? `<span class="pill plain">Old</span>` : ""}
        ${hidden && S.filter !== "hidden" ? `<span class="pill plain">Hidden</span>` : ""}
      </div>
      <div class="menu"><button class="more" data-menu aria-haspopup="menu" aria-label="Actions for ${esc(r.name)}">${icon("dots")}</button><div class="pop" role="menu">${menu}</div></div>
    </div>
    <h3 title="${esc(r.name)}">${esc(r.name)}</h3>
    <div class="path" title="${esc(r.display)}">${esc(shortPath(r.display))}</div>
    <div class="prog">
      <div class="prog-h"><span>Backup progress</span><b class="num">${st.n} of 3</b></div>
      <div class="steps">${st.done.map((d, k) => `<i class="${d ? "on" : ""}" style="--k:${k}; --c:${st.n === 3 ? "var(--green)" : lane.c}"></i>`).join("")}</div>
      <div class="steps-k">${["Committed", "Has remote", "Pushed"].map((l, k) => `<span class="${st.done[k] ? "on" : ""}">${l}</span>`).join("")}</div>
    </div>
    ${lane.id !== "safe" ? `<dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
    ${r.error ? `<p style="margin:10px 0 0;color:var(--red);font-size:12.5px">${esc(r.error)}</p>` : ""}
    ${panel(r)}
    <div class="card-foot">
      <div class="meta">
        <span title="Last activity" style="flex:none">${ago(r.last_active)}</span>
        ${r.branch ? `<span title="Branch">${icon("branch")}${esc(r.branch)}</span>` : ""}
      </div>
      ${p && !expanded ? `<button class="btn primary sm" data-act="${p[0]}">${p[1]}</button>` : ""}
    </div>
  </article>`;
}

/* bulk back-up / push review */
function bulkHTML(laneId) {
  const b = S.bulk;
  if (!b || b.lane !== laneId) return "";
  const on = b.items.filter(i => i.on);
  const verb = b.lane === "local" ? "Back up" : "Push";
  return `<section class="card bulk" style="view-transition-name: bulk-${laneId}">
    <div class="cat-h"><span class="chip" style="--c:var(--accent)">${icon(b.lane === "local" ? "cloud" : "up")}</span><h3>${verb} ${plural(b.items.length, "project")}</h3></div>
    <p class="cat-hint">${b.lane === "local"
      ? "Each project gets a snapshot of its changes (secrets, caches and big files held back), then a new private GitHub repo with everything pushed."
      : "Pushes each project's commits to its remote. Uncommitted changes stay local."}</p>
    ${b.items.map((it, k) => {
      const r = S.proj.repos.find(x => x.path === it.path) || { name: it.path, display: it.path };
      const st = it.state === "run" ? `<span class="st run">Working…</span>` : it.state === "ok" ? `<span class="st ok">${icon("check")} Done</span>`
        : it.state === "err" ? `<span class="st err">${esc(it.error || "Failed")}</span>`
        : `<span class="st">${it.include == null ? "Checking…" : it.include ? `${plural(it.include, "file")} to commit${it.exclude ? ` · ${it.exclude} held back` : ""}` : "Nothing to commit"}</span>`;
      return `<div class="bulk-row">
        <input type="checkbox" data-bulk-on="${k}" ${it.on ? "checked" : ""} ${b.running ? "disabled" : ""} aria-label="Include ${esc(r.name)}">
        <div style="min-width:0"><div class="nm">${esc(r.name)}</div><div class="p">${esc(shortPath(r.display, 60))}</div></div>
        ${b.lane === "local" ? `<input class="field" data-bulk-name="${k}" value="${esc(it.name)}" ${b.running ? "disabled" : ""} aria-label="GitHub repo name for ${esc(r.name)}">` : "<span></span>"}
        ${st}
      </div>`;
    }).join("")}
    <div class="acts">${b.done ? `<button class="btn" data-bulk-close>Close</button>` : `<button class="btn ghost" data-bulk-close ${b.running ? "disabled" : ""}>Cancel</button>
      <button class="btn primary ${b.running ? "loading" : ""}" data-bulk-go ${on.length && !b.running ? "" : "disabled"}>${verb} ${plural(on.length, "project")}</button>`}</div>
  </section>`;
}

async function startBulk(laneId) {
  const list = active().filter(r => laneOf(r).id === laneId).sort(byRisk);
  S.bulk = { lane: laneId, running: false, done: false, items: list.map(r => ({ path: r.path, name: slug(r.name), on: true, include: laneId === "local" ? null : 0, exclude: 0 })) };
  transition(render);
  if (laneId !== "local") return;
  const res = await post("/api/action", { action: "bulk_preview", paths: list.map(r => r.path) });
  for (const p of res.items || []) {
    const it = S.bulk?.items.find(i => i.path === p.path);
    if (it) Object.assign(it, { include: p.include, exclude: p.exclude, error: p.ok ? null : p.error });
  }
  if (S.view === "projects") renderProjects();
}

async function runBulk() {
  const b = S.bulk;
  const items = b.items.filter(i => i.on);
  b.running = true;
  items.forEach(i => i.state = "run");
  renderProjects();
  const res = await post("/api/action", { action: "bulk_backup", items: items.map(i => ({ path: i.path, name: i.name })) });
  for (const r of res.results || []) {
    const it = b.items.find(i => i.path === r.path);
    if (it) Object.assign(it, { state: r.ok ? "ok" : "err", error: r.error });
    if (r.repo) S.proj.repos = S.proj.repos.map(x => x.path === r.repo.path ? r.repo : x);
  }
  b.running = false; b.done = true;
  toast(res.message || "Done.", !res.ok);
  transition(render);
}

/* copies: what each copy has that the others don't */
async function compareCopies(group) {
  S.copies[group] = { loading: true };
  renderProjects();
  S.copies[group] = await getJSON(`/api/copies?group=${group}`);
  renderProjects();
}

function copySets(list) {
  const sets = {};
  list.forEach(r => (sets[r.dup_group] ||= []).push(r));
  const groups = Object.entries(sets).map(([g, rs]) => [g, rs.sort((a, b) => (b.last_active || 0) - (a.last_active || 0))])
    .sort((a, b) => (b[1][0].last_active || 0) - (a[1][0].last_active || 0));
  if (!groups.length) return `<div class="empty"><b>No copies</b>Every project lives in exactly one folder.</div>`;
  return `<div class="grid">${groups.map(([g, rs]) => {
    const an = S.copies[g];
    const info = p => an?.copies?.find(c => c.path === p);
    return `<article class="card" style="view-transition-name: set-${g}">
      <div class="card-top"><div class="tags"><span class="pill plain">${icon("copy")}${rs.length} copies</span></div>
        ${an?.copies ? "" : `<button class="btn sm ${an?.loading ? "loading" : ""}" data-compare="${g}">Compare</button>`}</div>
      <h3>${esc([...new Set(rs.map(r => r.name))].join(" / "))}</h3>
      <div class="path" style="direction:ltr">${an?.copies ? "Unique commits are ones no other copy has. A copy with none, and no unsaved work, is safe to remove." : "Same history in several folders. Compare to see what each one has."}</div>
      <ul class="copies">${rs.map((r, i) => {
        const c = info(r.path);
        const acts = [`<button class="btn sm" data-copy-open="${esc(r.path)}">Open</button>`];
        if (c && i > 0 && c.unique) acts.unshift(`<button class="btn sm primary" data-copy-fetch="${esc(r.path)}" data-into="${esc(rs[0].path)}">Bring into newest</button>`);
        if (c && c.contained) acts.unshift(`<button class="btn sm" data-copy-trash="${esc(r.path)}">${icon("trash")}Remove</button>`);
        return `<li>
          <span class="p" title="${esc(r.display)}">${esc(shortPath(r.display, 56))}</span><span class="copy-acts">${acts.join("")}</span>
          <span class="tags">${i === 0 ? `<span class="pill" style="--c:var(--accent)">Newest</span>` : ""}
            ${c ? (c.unique ? `<span class="pill" style="--c:var(--amber)">${plural(c.unique, "unique commit")}</span>` : `<span class="pill plain">No unique commits</span>`) : ""}
            ${r.dirty || r.unpushed ? `<span class="pill" style="--c:var(--amber)">${r.dirty ? plural(r.dirty, "unsaved change") : plural(r.unpushed, "unpushed commit")}</span>` : `<span class="pill plain">Clean</span>`}
            <span class="pill plain">${ago(r.last_active)}</span></span>
          ${c?.commits?.length ? `<ul class="commits">${c.commits.slice(0, 3).map(x => `<li><code>${esc(x.hash)}</code>${esc(x.subject)}</li>`).join("")}${c.unique > 3 ? `<li>and ${c.unique - 3} more</li>` : ""}</ul>` : ""}
        </li>`;
      }).join("")}</ul></article>`;
  }).join("")}</div>`;
}

function renderProjects() {
  const app = $("#app");
  if (!S.proj) {
    app.innerHTML = `<div class="skel" style="height:30px;width:220px;margin-bottom:24px"></div><div class="stats">${"<div class='skel' style='height:122px'></div>".repeat(4)}</div><div class="grid">${"<div class='skel' style='height:280px'></div>".repeat(4)}</div>`;
    return;
  }
  const v = visible(), act = active();
  const n = id => act.filter(r => laneOf(r).id === id).length;
  const exposed = act.length - n("safe");
  const changes = act.reduce((s, r) => s + (laneOf(r).id !== "safe" ? r.dirty : 0), 0);
  const counts = { active: act.length, attention: exposed, copies: new Set(v.filter(r => r.dup_group).map(r => r.dup_group)).size, old: v.length - act.length, hidden: S.hidden.size };
  const list = filtered();
  const blocked = S.proj.blocked || [];
  let body;
  if (S.filter === "copies") body = copySets(list);
  else if (!list.length) body = `<div class="empty"><b>${S.q ? "No matches" : "Nothing here"}</b>${S.q ? `No project matches “${esc(S.q)}”.` : S.filter === "hidden" ? "Hide a project from its ••• menu to file it here." : "All clear."}</div>`;
  else body = LANES.map(l => {
    const items = list.filter(r => laneOf(r).id === l.id).sort(byRisk);
    if (!items.length) return "";
    const canBulk = ["active", "attention"].includes(S.filter) && !S.q && items.length > 1 && (l.id === "local" ? S.proj.gh : l.id === "unpushed");
    return `<section class="sec" id="sec-${l.id}"><div class="sec-h"><h2>${l.title}</h2><span class="count num">${items.length}</span><span class="hint">${l.hint}</span>
      ${canBulk && S.bulk?.lane !== l.id ? `<button class="btn sm" data-bulk="${l.id}">${icon(l.id === "local" ? "cloud" : "up")}${l.id === "local" ? "Back up all" : "Push all"}</button>` : ""}</div>
      ${bulkHTML(l.id)}<div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");

  const sub = { old: `${plural(counts.old, "repo")} untouched for over a year. Shown separately so they don't crowd current work.`,
    hidden: S.hidden.size ? `${plural(S.hidden.size, "project")} you've hidden from Radar.` : "Nothing hidden.",
    copies: `${plural(counts.copies, "project")} live in more than one folder.` }[S.filter]
    || (exposed ? `${plural(exposed, "project")} ${exposed === 1 ? "needs" : "need"} attention out of ${act.length} active.` : `All ${act.length} active projects are backed up.`);
  app.innerHTML = `
    <div class="page-h">
      <div><h1>Projects</h1><p>${sub}</p></div>
      <div class="pills" role="group" aria-label="Filter">${FILTERS.map(([k, label]) => `<button data-filter="${k}" aria-pressed="${S.filter === k}">${label}<span class="n num">${counts[k]}</span></button>`).join("")}</div>
    </div>
    <div class="stats">
      ${stat("var(--red)", "laptop", `Only on ${here()}`, n("local"), "", "No remote at all", null, "local")}
      ${stat("var(--amber)", "edit", "Uncommitted", changes, "changes", plural(act.filter(r => r.dirty).length, "project"), null, "dirty")}
      ${stat("var(--blue)", "up", "Not pushed", n("unpushed"), n("unpushed") === 1 ? "project" : "projects", "Committed, not on a remote", null, "unpushed")}
      ${stat("var(--green)", "check", "Backed up", n("safe"), `/ ${act.length}`, "", act.length ? n("safe") / act.length : 0, "safe")}
    </div>
    ${blocked.length ? `<div class="notice"><b>Some folders couldn't be read:</b> <code>${blocked.map(esc).join(", ")}</code>. ${P.os === "mac" ? "Allow Radar in System Settings › Privacy &amp; Security › Files &amp; Folders" : "Check that your account can open them"}, then press ${P.mod}R.</div>` : ""}
    ${body}`;
  if (S.flash) {
    const el = document.querySelector(`.card[data-path="${CSS.escape(S.flash)}"]`);
    if (el) { el.classList.add("flash"); el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" }); }
    S.flash = null;
  }
}

async function act(r, type, where) {
  if (type === "open") return post("/api/action", { action: "open", path: r.path, where });
  if (type === "hide" || type === "unhide") {
    await post("/api/action", { action: type, path: r.path });
    type === "hide" ? S.hidden.add(r.path) : S.hidden.delete(r.path);
    toast(type === "hide" ? `${r.name} is hidden. Find it under Hidden.` : `${r.name} is back.`);
    return transition(render);
  }
  if (type === "commit") {
    const btn = document.querySelector(`.card[data-path="${CSS.escape(r.path)}"] .btn[data-act="commit"]`);
    btn?.classList.add("loading");
    const prev = await post("/api/action", { action: "preview", path: r.path });
    btn?.classList.remove("loading");
    if (!prev.ok) return toast(prev.error, true);
    S.pending = { type, path: r.path, preview: prev };
    return transition(render);
  }
  if (type === "github" || type === "trash_node_modules") {
    S.pending = { type, path: r.path };
    transition(render);
    if (type === "github") setTimeout(() => $("#ghname")?.select(), 60);
    return;
  }
  if (type === "push") return run(r, { action: "push", path: r.path });
}

async function run(r, body, btn) {
  btn?.classList.add("loading");
  if (!btn) { S.busy = r.path; render(); }
  if (body.action === "push" && r.dirty) toast("Pushing commits only. Uncommitted changes stay local.");
  const res = await post("/api/action", body);
  S.busy = null; S.pending = null; S.flash = r.path;
  if (res.repo) S.proj.repos = S.proj.repos.map(x => x.path === res.repo.path ? res.repo : x);
  res.ok ? toast(res.message || "Done.") : toast(res.error || "Something went wrong.", true);
  transition(render);
}

window.radarFocus = path => {   // from the menu bar
  const r = S.proj?.repos.find(x => x.path === path);
  if (!r) return;
  S.view = "projects"; S.q = ""; $("#q").value = "";
  S.filter = S.hidden.has(path) ? "hidden" : has(r, "stale") ? "old" : "active";
  S.flash = path;
  transition(render);
};

/* ============================================================ cleanup */

const KINDS = [["downloads", "Downloads", "download"], ["desktop", "Desktop", "monitor"], ["storage", "Storage", "disk"]];
const SHOW = 8;
const CAT_ICON = { partial: "disk", duplicate: "copy", installer: "box", extracted: "folder", screenshot: "image", sensitive: "key", video: "film", archive: "box", project: "code", other: "folder",
  deps: "box", npm: "download", caches: "disk", xcode: "code", toolfolders: "ghost" };
const CAT_C = { partial: "var(--amber)", duplicate: "var(--blue)", installer: "var(--accent)", extracted: "var(--blue)", screenshot: "var(--blue)", sensitive: "var(--red)",
  deps: "var(--amber)", npm: "var(--accent)", caches: "var(--blue)", xcode: "var(--blue)", toolfolders: "var(--text-3)" };
const sweep = () => S.sweeps[S.sub];
const picked = kind => (S.picked[kind] ||= new Set());

async function loadSweep(kind, refresh) {
  const d = await getJSON(`/api/sweep?kind=${kind}${refresh ? "&refresh=1" : ""}`);
  const had = S.picked[kind];
  const paths = new Set(d.items.map(i => i.path));
  S.picked[kind] = had ? new Set([...had].filter(p => paths.has(p))) : new Set(d.items.filter(i => i.suggest).map(i => i.path));
  S.sweeps[kind] = d;
  return d;
}

function sweepStats(d) {
  const items = d.items;
  const total = items.reduce((s, i) => s + i.size, 0) || 1;
  const sel = items.filter(i => picked(S.sub).has(i.path));
  const selSize = sel.reduce((s, i) => s + i.size, 0);
  const sug = items.filter(i => i.suggest);
  const [v, u] = sizeParts(selSize);
  const big = S.sub === "storage" ? items.filter(i => i.category === "caches" && !i.suggest).reduce((s, i) => s + i.size, 0)
    : items.filter(i => ["video", "screenshot"].includes(i.category) && !i.suggest).reduce((s, i) => s + i.size, 0);
  const secrets = items.filter(i => i.category === "sensitive").length;
  return `
    ${stat("var(--accent)", "trash", "Selected", v, `${u} of ${human(total)}`, "", selSize / total)}
    ${stat("var(--green)", "check", "Safe to clear", sug.length, "items", `${human(sug.reduce((s, i) => s + i.size, 0))} pre-ticked for you`)}
    ${S.sub === "storage"
      ? stat("var(--text-3)", "disk", "App caches", ...sizeParts(big), "Unticked: quit the app first")
      : stat("var(--text-3)", "film", "Media", ...sizeParts(big), "Left for you to decide")}
    ${S.sub === "storage"
      ? stat("var(--text-3)", "ghost", "AI-tool folders", items.filter(i => i.category === "toolfolders").length, "", "Only hold a copied skill")
      : stat("var(--red)", "key", "Look like secrets", secrets, "", secrets ? "Move somewhere safe" : "None found")}`;
}

function catCard(c) {
  const d = sweep();
  const items = d.items.filter(i => i.category === c.id);
  if (!items.length) return "";
  const size = items.reduce((s, i) => s + i.size, 0);
  const list = S.expanded.has(S.sub + c.id) || items.length <= SHOW + 2 ? items : items.slice(0, SHOW);
  const allOn = items.every(i => picked(S.sub).has(i.path));
  const lockable = c.id !== "project";
  return `<section class="card" data-cat="${c.id}">
    <div class="cat-h"><span class="chip" style="--c:${CAT_C[c.id] || "var(--text-3)"}">${icon(CAT_ICON[c.id] || "folder")}</span><h3>${esc(c.title)}</h3><span class="pill plain num">${human(size)}</span>${lockable ? `<button class="link" data-all="${c.id}">${allOn ? "Clear" : "Select all"}</button>` : ""}</div>
    <p class="cat-hint">${esc(c.blurb)}</p>
    <ul class="items">${list.map(i => item(i, lockable)).join("")}</ul>
    ${list.length < items.length ? `<div class="more-row"><button class="link" data-more="${c.id}">Show ${items.length - list.length} more</button></div>` : ""}
  </section>`;
}

function item(i, selectable = true) {
  const good = /already installed|Same as|Unpacked as|Re-downloaded|also in ~\/\.claude|days old|npm cache|pip cache/.test(i.note);
  return `<li><label class="item" data-path="${esc(i.path)}">
    ${selectable ? `<input type="checkbox" ${picked(S.sub).has(i.path) ? "checked" : ""} aria-label="Select ${esc(i.name)}">` : `<span class="chip" style="width:18px;height:18px;border-radius:5px">${icon("code")}</span>`}
    <span style="min-width:0"><div class="nm" title="${esc(i.name)}">${esc(i.name)}${i.is_dir && !i.name.endsWith("/") ? "/" : ""}</div><div class="note ${good ? "good" : ""}">${i.note ? esc(i.note) + " · " : ""}${shortDate(i.mtime)}</div></span>
    <button class="btn ghost sm reveal" data-reveal="${esc(i.path)}">Show</button><span class="sz">${human(i.size)}</span>
  </label></li>`;
}

function renderCleanup() {
  const app = $("#app");
  const d = sweep();
  const nav = `<div class="pills subnav" role="group" aria-label="Clean up">${KINDS.map(([k, label]) => {
    const s = S.sweeps[k];
    const sug = s ? s.items.filter(i => i.suggest).reduce((a, i) => a + i.size, 0) : null;
    return `<button data-sub="${k}" aria-pressed="${S.sub === k}">${label}${sug != null ? `<span class="n num">${human(sug)}</span>` : ""}</button>`;
  }).join("")}</div>`;
  const title = { downloads: "Downloads", desktop: "Desktop", storage: "Storage" }[S.sub];
  if (!d) {
    app.innerHTML = `<div class="page-h"><div><h1>Clean up</h1><p>Scanning ${title.toLowerCase()}…</p></div></div>${nav}<div class="stats">${"<div class='skel' style='height:122px'></div>".repeat(4)}</div>`;
    loadSweep(S.sub).then(() => { if (S.view === "cleanup") transition(render); });
    return;
  }
  const total = d.items.reduce((s, i) => s + i.size, 0);
  const lede = { downloads: `${d.items.length} items, ${human(total)} in Downloads.`, desktop: `${d.items.length} items, ${human(total)} on your Desktop. Git projects are never ticked.`,
    storage: `${human(total)} of space that rebuilds itself: dependency folders, package caches, app caches and Xcode data.` }[S.sub];
  const docker = S.sub === "storage" && d.docker ? `<div class="card note-card"><span class="chip" style="--c:var(--blue)">${icon("box")}</span><div><b>Docker uses ${human(d.docker.disk)}</b>
    <p>${d.docker.running ? `Reclaimable: ${esc(d.docker.reclaimable || "unknown")}. Run <code>docker system prune</code> to free unused images and containers.` : "Docker isn't running. Open Docker Desktop and use Troubleshoot › Clean / Purge data, or run <code>docker system prune</code> once it's up."}</p></div></div>` : "";
  app.innerHTML = `
    <div class="page-h"><div><h1>Clean up</h1><p>${lede} Everything goes to the ${P.trash} and can be undone.</p></div>
      <button class="btn" data-suggested>Select suggested</button></div>
    ${nav}
    <div class="stats" id="swstats">${sweepStats(d)}</div>
    ${docker}
    <div class="dl-grid">${d.categories.map(catCard).join("")}</div>`;
}

function renderActionbar() {
  const bar = $("#actionbar");
  const d = sweep();
  if (S.view !== "cleanup" || !d) { bar.classList.remove("ready"); return; }
  const sel = d.items.filter(i => picked(S.sub).has(i.path));
  const size = sel.reduce((s, i) => s + i.size, 0);
  $("#ab").innerHTML = S.confirmSweep && sel.length
    ? `<span class="total">Move <b>${plural(sel.length, "item")}</b> (<b>${human(size)}</b>) to the ${P.trash}?</span><span class="confirm"><button class="btn ghost" id="nosweep">Cancel</button><button class="btn danger" id="dosweep">Move to ${P.trash}</button></span>`
    : `<span class="total num"><b>${sel.length}</b> selected · <b>${human(size)}</b></span>
       ${d.can_undo ? `<button class="btn ghost" id="undo">Undo last sweep</button>` : ""}
       <button class="btn primary" id="go" ${sel.length ? "" : "disabled"}>Move to ${P.trash}</button>`;
  requestAnimationFrame(() => bar.classList.add("ready"));
}

function selectionChanged() {
  if ($("#swstats")) $("#swstats").innerHTML = sweepStats(sweep());
  document.querySelectorAll("[data-all]").forEach(l => {
    const its = sweep().items.filter(i => i.category === l.dataset.all);
    l.textContent = its.every(i => picked(S.sub).has(i.path)) ? "Clear" : "Select all";
  });
  S.confirmSweep = false;
  renderActionbar();
}

async function doSweep() {
  const sel = sweep().items.filter(i => picked(S.sub).has(i.path));
  $("#dosweep")?.classList.add("loading");
  const res = await post("/api/sweep/action", { kind: S.sub, action: "trash", paths: sel.map(i => i.path) });
  res.ok ? toast(res.message) : toast(res.message || res.error, true);
  S.confirmSweep = false;
  if (res.scan) { S.picked[S.sub] = new Set(); S.sweeps[S.sub] = res.scan; }
  transition(render);
}
async function undoSweep() {
  const res = await post("/api/sweep/action", { kind: S.sub, action: "undo" });
  res.ok ? toast(res.message) : toast(res.error, true);
  S.sweeps = {};
  if (res.scan) S.sweeps[S.sub] = res.scan;
  transition(render);
}

/* ============================================================ secrets */

const LEAK_KINDS = [
  ["tracked", "Tracked in git", "These files are committed. If the repo is pushed, the secret is on the remote too. Stop tracking them, then rotate the key.", "var(--red)"],
  ["unignored", "Not ignored", "Git would pick these up on the next “git add .”. Radar's snapshot holds them back, but other tools won't.", "var(--amber)"],
  ["loose", "Loose credential files", "Keys sitting in Desktop, Documents or Downloads.", "var(--blue)"],
];

function renderSecrets() {
  const app = $("#app");
  if (!S.leaks) {
    app.innerHTML = `<div class="page-h"><div><h1>Secrets</h1><p>Looking for credential files…</p></div></div><div class="stats">${"<div class='skel' style='height:122px'></div>".repeat(3)}</div>`;
    getJSON("/api/secrets").then(d => { S.leaks = d; if (S.view === "secrets") transition(render); });
    return;
  }
  const f = S.leaks.findings;
  const n = k => f.filter(x => x.kind === k).length;
  const sections = LEAK_KINDS.map(([k, title, hint, c]) => {
    const rows = f.filter(x => x.kind === k);
    if (!rows.length) return "";
    return `<section class="sec"><div class="sec-h"><h2>${title}</h2><span class="count num">${rows.length}</span><span class="hint">${hint}</span></div>
      <div class="card">${rows.map(x => `<div class="finding">
        <div class="nm">${esc(x.rel || x.name)}${x.kind === "tracked" && x.remote ? ` <span class="pill" style="--c:var(--red)">On ${esc(remoteName(x.remote))}</span>` : ""}</div>
        <div class="acts">
          ${x.kind === "tracked" ? `<button class="btn sm" data-leak="untrack" data-id="${x.id}">Stop tracking</button>` : ""}
          ${x.kind === "unignored" ? `<button class="btn sm" data-leak="ignore" data-id="${x.id}">Add to .gitignore</button>` : ""}
          ${x.kind === "loose" ? `<button class="btn sm" data-leak="trash" data-id="${x.id}">${icon("trash")}Move to ${P.trash}</button>` : ""}
          <button class="btn ghost sm" data-reveal="${esc(x.path)}">Show</button>
        </div>
        <div class="p">${esc(x.repo ? `${x.name} · ${shortPath(x.display, 80)}` : shortPath(x.display, 90))}</div>
      </div>`).join("")}</div></section>`;
  }).join("");
  app.innerHTML = `
    <div class="page-h"><div><h1>Secrets</h1><p>${f.length ? `${plural(f.length, "file")} that look like keys or credentials.` : "No credential files found in your projects or folders."} Checked in ${S.leaks.seconds}s.</p></div>
      <button class="btn" data-leak-rescan>Check again</button></div>
    <div class="stats">
      ${stat("var(--red)", "shield", "Tracked in git", n("tracked"), "", "Committed to a repo")}
      ${stat("var(--amber)", "key", "Not ignored", n("unignored"), "", "Would be committed next")}
      ${stat("var(--blue)", "folder", "Loose files", n("loose"), "", "In Desktop, Documents or Downloads")}
    </div>
    ${sections || `<div class="empty"><b>All clear</b>Nothing looks like a credential file.</div>`}`;
}

/* ============================================================ convert */

const FORMATS = ["pdf", "docx", "txt", "jpg", "png", "heic", "html", "rtf"];
function renderConvert() {
  const app = $("#app");
  if (!S.conv) {
    app.innerHTML = `<div class="page-h"><div><h1>Convert</h1><p>Finding recent files…</p></div></div><div class="skel" style="height:160px"></div>`;
    getJSON("/api/convert/recent").then(d => { S.conv = d; if (S.view === "convert") transition(render); });
    return;
  }
  const native = S.conv.native;

  if (!fmts.includes(S.convTo)) S.convTo = fmts[0];

  app.innerHTML = `
    <div class="page-h"><div><h1>Convert</h1><p>One click to turn documents and images into another format. Converted files are saved next to the original${native ? "" : P.os === "mac" ? ". PDF needs Radar.app" : ". Documents and PDF need Microsoft Word or LibreOffice"}.</p></div>
      <div class="pills" role="group" aria-label="Convert dropped files to">${fmts.map(f => `<button data-conv-to="${f}" aria-pressed="${S.convTo === f}">${f.toUpperCase()}</button>`).join("")}</div></div>
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose files to convert">
      <span class="chip" style="--c:var(--accent)">${icon("convert")}</span>
      <b>Drop files here to convert them to ${S.convTo.toUpperCase()}</b>
      <p>Or click to choose. Word, RTF, text, Markdown, HTML, PDF and images. Results go to Downloads.</p>
    </div>
    <section class="card"><div class="cat-h"><span class="chip">${icon("doc")}</span><h3>Recent files</h3><span class="pill plain">${S.conv.items.length}</span></div>
      <p class="cat-hint">From Downloads, Desktop and Documents. Pick a format to convert in place.</p>
      ${S.conv.items.length ? S.conv.items.map(i => `<div class="conv-row" data-path="${esc(i.path)}">
        <span class="chip">${icon(kindIcon(i.name))}</span>
        <div style="min-width:0"><div class="nm" title="${esc(i.name)}">${esc(i.name)}</div><div class="p">${esc(i.folder)} · ${human(i.size)} · ${shortDate(i.mtime)}</div></div>
        <div class="fmt">${i.targets.map(t => `<button class="btn" data-convert="${t}">${t.toUpperCase()}</button>`).join("")}</div>
      </div>`).join("") : `<div class="empty">No documents or images in Downloads, Desktop or Documents.</div>`}

async function convertOne(path, to, btn) {
  btn?.classList.add("loading");
  const res = await post("/api/convert", { path, to });
  btn?.classList.remove("loading");
  if (!res.ok) return toast(res.error || "Couldn't convert that file.", true);
  const out = res.outputs[0];
  toast(`Saved ${out.split(/[\\/]/).pop()}${res.outputs.length > 1 ? ` and ${res.outputs.length - 1} more` : ""}`, false, { label: "Show", fn: () => reveal(out) });
  S.conv = null;
  if (S.view === "convert") renderConvert();
}

async function convertFiles(files) {
  for (const f of files) {
    const t = document.createElement("div");
    toast(`Converting ${f.name}…`);
    const r = await fetch(`/api/convert/upload?name=${encodeURIComponent(f.name)}&to=${S.convTo}`, { method: "POST", headers: { "X-Radar-Token": TOKEN }, body: f });
    const res = await r.json();
    if (res.ok) toast(`Saved ${res.outputs[0].split(/[\\/]/).pop()} to Downloads`, false, { label: "Show", fn: () => reveal(res.outputs[0]) });
    else toast(`${f.name}: ${res.error}`, true);
  }
  S.conv = null;
  if (S.view === "convert") renderConvert();
}

/* ============================================================ ⌘K project switcher */

const pal = { open: false, q: "", i: 0, list: [] };
function palResults() {
  if (!S.proj) return [];
  const q = pal.q.toLowerCase().trim();
  const score = r => {
    if (!q) return 0;
    const name = r.name.toLowerCase(), path = r.display.toLowerCase();
    if (name.startsWith(q)) return 4;
    if (name.includes(q)) return 3;
    if (path.includes(q)) return 2;
    let k = 0;   // letters in order, within the name only
    for (const ch of name) if (ch === q[k]) k++;
    return k === q.length ? 1 : -1;
  };
  return S.proj.repos.map(r => [score(r), r]).filter(([s]) => s >= 0)
    .sort((a, b) => b[0] - a[0] || has(a[1], "stale") - has(b[1], "stale") || (b[1].last_active || 0) - (a[1].last_active || 0)).slice(0, 12).map(x => x[1]);
}
function renderPalette() {
  const el = $("#palette");
  el.hidden = !pal.open;
  if (!pal.open) return;
  pal.list = palResults();
  pal.i = Math.min(pal.i, Math.max(0, pal.list.length - 1));
  const ul = pal.list.length ? `<ul role="listbox">${pal.list.map((r, k) => `<li role="option" data-pal="${k}" aria-selected="${k === pal.i}" style="--c:${laneOf(r).c}">
      <span class="dot"></span><span class="nm">${esc(r.name)}</span><span class="ln">${laneOf(r).pill}</span><span class="p">${esc(shortPath(r.display, 70))}</span></li>`).join("")}</ul>`
    : `<div class="none">No project matches “${esc(pal.q)}”.</div>`;
  if (!el.firstChild) {
    el.innerHTML = `<div class="pal" role="dialog" aria-label="Go to project"><input id="palq" placeholder="Go to project…" autocomplete="off" spellcheck="false"><div id="pallist"></div>
      <footer><span><kbd>↵</kbd>Open in ${S.proj?.editor ? "VS Code" : "editor"}</span><span><kbd>${P.mod}↵</kbd>${P.terminal}</span><span><kbd>${P.os === "mac" ? "⌥" : "Alt+"}↵</kbd>${P.files}</span><span><kbd>⇧↵</kbd>Show card</span><span><kbd>esc</kbd>Close</span></footer></div>`;
    $("#palq").addEventListener("input", e => { pal.q = e.target.value; pal.i = 0; renderPalette(); });
  }
  $("#pallist").innerHTML = ul;
  $("#pallist [aria-selected=true]")?.scrollIntoView({ block: "nearest" });
}
window.openPalette = () => {
  if (!S.proj) return;
  pal.open = true; pal.q = ""; pal.i = 0;
  $("#palette").innerHTML = "";
  renderPalette();
  $("#palq").focus();
};
function closePalette() { pal.open = false; renderPalette(); }
function palGo(e) {
  const r = pal.list[pal.i];
  if (!r) return;
  closePalette();
  if (e.shiftKey) return radarFocus(r.path);
  post("/api/action", { action: "open", path: r.path, where: e.metaKey || e.ctrlKey ? "terminal" : e.altKey ? "finder" : "editor" });
}

/* ============================================================ shell */

function render() {
  document.body.classList.toggle("view-cleanup", S.view === "cleanup");
  document.body.classList.toggle("view-other", S.view !== "projects");
  document.querySelectorAll("#views [data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === S.view));
  if (S.proj) nativePost({ atRisk: active().filter(r => laneOf(r).id !== "safe").length });
  ({ projects: renderProjects, cleanup: renderCleanup, secrets: renderSecrets, convert: renderConvert })[S.view]();
  renderActionbar();
}

let renderTimer;
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    const typing = a && a.tagName === "INPUT" && a.id !== "q" && $("#app").contains(a);
    if (typing || S.bulk?.running || pal.open) return scheduleRender();   // don't yank the page from under the user
    if (S.view === "projects") transition(render);
  }, 300);
}

async function loadProjects(refresh) {
  const r = await fetch("/api/scan" + (refresh ? "?refresh=1" : ""));
  S.proj = await r.json();
  S.hidden = new Set(S.proj.hidden || []);
  if (S.proj.platform) Object.assign(P, S.proj.platform);
  $("#rescan").title = `Rescan (${P.mod}R)`;
}
async function rescan() {
  const b = $("#rescan");
  if (b.disabled) return;
  b.classList.add("spinning"); b.disabled = true;
  try {
    const jobs = [loadProjects(true)];
    if (S.view === "cleanup") jobs.push(loadSweep(S.sub, true));
    if (S.view === "secrets") jobs.push(getJSON("/api/secrets?refresh=1").then(d => S.leaks = d));
    if (S.view === "convert") S.conv = null;
    await Promise.all(jobs);
    transition(render); toast("Up to date.");
  } catch { toast(`Couldn't reach Radar's engine. Try ${P.mod}${P.os === "mac" ? "⇧" : "Shift+"}R.`, true); }
  b.classList.remove("spinning"); b.disabled = false;
}
window.rescan = rescan;  // ⌘R in Radar.app

function setTheme(t) {
  transition(() => { document.documentElement.dataset.theme = t; store.set("theme", t); nativePost({ theme: t }); });
}

/* live updates pushed by the engine */
function connectEvents() {
  const es = new EventSource("/api/events");
  const setLive = on => { S.live = on; };
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);   // EventSource reconnects on its own
  es.addEventListener("repo", e => {
    if (!S.proj) return;
    const r = JSON.parse(e.data);
    const i = S.proj.repos.findIndex(x => x.path === r.path);
    i >= 0 ? (S.proj.repos[i] = r) : S.proj.repos.push(r);
    scheduleRender();
  });
  es.addEventListener("scan", async () => {
    await loadProjects(false);
    S.sweeps.storage = undefined;
    scheduleRender();
  });
  es.addEventListener("sweep", async e => {
    const { kind } = JSON.parse(e.data);
    if (S.view === "cleanup" && S.sub === kind && !S.confirmSweep) { await loadSweep(kind); transition(render); }
    else delete S.sweeps[kind];
  });
}

document.addEventListener("click", e => {
  const t = e.target;
  const menuBtn = t.closest("[data-menu]");
  document.querySelectorAll(".menu.open").forEach(m => { if (!menuBtn || !m.contains(menuBtn)) m.classList.remove("open"); });
  if (menuBtn) { menuBtn.parentElement.classList.toggle("open"); return; }
  if (pal.open && t.id === "palette") return closePalette();
  const pli = t.closest("[data-pal]");
  if (pli) { pal.i = +pli.dataset.pal; return palGo(e); }

  const v = t.closest("[data-view]");
  if (v && v.dataset.view !== S.view) { S.view = v.dataset.view; store.set("view", S.view); S.confirmSweep = false; scrollTo({ top: 0 }); return transition(render); }
  if (t.closest("#theme")) return setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  if (t.closest("#rescan")) return rescan();
  const f = t.closest("[data-filter]");
  if (f && f.dataset.filter !== S.filter) { S.filter = f.dataset.filter; S.pending = null; S.bulk = null; return transition(render); }
  const j = t.closest("[data-jump]");
  if (j) {
    const go = () => document.getElementById("sec-" + j.dataset.jump)?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
    if (!["active", "attention"].includes(S.filter) || (j.dataset.jump === "safe" && S.filter === "attention")) { S.filter = "active"; transition(render); setTimeout(go, 380); } else go();
    return;
  }
  // bulk
  const bk = t.closest("[data-bulk]");
  if (bk) return startBulk(bk.dataset.bulk);
  if (t.closest("[data-bulk-close]")) { S.bulk = null; return transition(render); }
  if (t.closest("[data-bulk-go]")) return runBulk();
  // copies
  const cmp = t.closest("[data-compare]");
  if (cmp) return compareCopies(cmp.dataset.compare);
  const cf = t.closest("[data-copy-fetch]");
  if (cf) {
    cf.classList.add("loading");
    return post("/api/action", { action: "copy_fetch", path: cf.dataset.into, from: cf.dataset.copyFetch }).then(res => {
      res.ok ? toast(res.message) : toast(res.error, true);
      if (res.repo) S.proj.repos = S.proj.repos.map(x => x.path === res.repo.path ? res.repo : x);
      const g = Object.keys(S.copies).find(k => S.copies[k].copies?.some(c => c.path === cf.dataset.into));
      if (g) compareCopies(g); else renderProjects();
    });
  }
  const ct = t.closest("[data-copy-trash]");
  if (ct) {
    if (!ct.dataset.sure) { ct.dataset.sure = "1"; ct.innerHTML = `${icon("trash")}Confirm remove`; ct.classList.add("danger"); return; }
    ct.classList.add("loading");
    return post("/api/action", { action: "copy_trash", path: ct.dataset.copyTrash }).then(async res => {
      res.ok ? toast(res.message) : toast(res.error, true);
      if (res.ok) { await loadProjects(false); S.copies = {}; }
      transition(render);
    });
  }
  const co = t.closest("[data-copy-open]");
  if (co) return post("/api/action", { action: "open", path: co.dataset.copyOpen, where: "editor" });
  // card actions
  const a = t.closest("[data-act]");
  if (a) {
    a.closest(".menu")?.classList.remove("open");
    const r = S.proj.repos.find(x => x.path === a.closest(".card").dataset.path);
    return act(r, a.dataset.act, a.dataset.where);
  }
  if (t.closest("[data-cancel]")) { S.pending = null; return transition(render); }
  const d = t.closest("[data-do]");
  if (d) {
    const r = S.proj.repos.find(x => x.path === d.closest(".card").dataset.path);
    const body = { action: d.dataset.do, path: r.path };
    if (d.dataset.do === "github") body.name = $("#ghname").value;
    return run(r, body, d);
  }

  // cleanup
  const sb = t.closest("[data-sub]");
  if (sb && sb.dataset.sub !== S.sub) { S.sub = sb.dataset.sub; store.set("sub", S.sub); S.confirmSweep = false; return transition(render); }
  const rev = t.closest("[data-reveal]");
  if (rev) { e.preventDefault(); return reveal(rev.dataset.reveal); }
  const more = t.closest("[data-more]");
  if (more) { S.expanded.add(S.sub + more.dataset.more); return transition(render); }
  const all = t.closest("[data-all]");
  if (all) {
    const its = sweep().items.filter(i => i.category === all.dataset.all);
    const on = !its.every(i => picked(S.sub).has(i.path));
    its.forEach(i => on ? picked(S.sub).add(i.path) : picked(S.sub).delete(i.path));
    document.querySelectorAll(`[data-cat="${all.dataset.all}"] input`).forEach(cb => cb.checked = on);
    return selectionChanged();
  }
  if (t.closest("[data-suggested]")) {
    S.picked[S.sub] = new Set(sweep().items.filter(i => i.suggest).map(i => i.path));
    document.querySelectorAll(".item").forEach(it => { const cb = it.querySelector("input"); if (cb) cb.checked = picked(S.sub).has(it.dataset.path); });
    return selectionChanged();
  }
  if (t.closest("#undo")) return undoSweep();
  if (t.closest("#go")) { S.confirmSweep = true; renderActionbar(); setTimeout(() => $("#dosweep")?.focus(), 30); return; }
  if (t.closest("#nosweep")) { S.confirmSweep = false; return renderActionbar(); }
  if (t.closest("#dosweep")) return doSweep();

  // secrets
  if (t.closest("[data-leak-rescan]")) { S.leaks = null; return renderSecrets(); }
  const lk = t.closest("[data-leak]");
  if (lk) {
    if (lk.dataset.leak === "trash" && !lk.dataset.sure) { lk.dataset.sure = "1"; lk.textContent = "Confirm"; lk.classList.add("danger"); return; }
    lk.classList.add("loading");
    return post("/api/secrets/action", { id: lk.dataset.id, action: lk.dataset.leak }).then(res => {
      res.ok ? toast(res.message || "Done.") : toast(res.error, true);
      if (res.scan) S.leaks = res.scan;
      transition(render);
    });
  }

  // convert
  const ct2 = t.closest("[data-conv-to]");
  if (ct2) { S.convTo = ct2.dataset.convTo; store.set("convTo", S.convTo); return renderConvert(); }
  const cv = t.closest("[data-convert]");
  if (cv) return convertOne(cv.closest(".conv-row").dataset.path, cv.dataset.convert, cv);
  if (t.closest("#drop")) return $("#filepick").click();

  if (t.closest("#search") && innerWidth <= 760) { $("#search").classList.add("open"); $("#q").focus(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "filepick") { const files = [...e.target.files]; e.target.value = ""; return convertFiles(files); }
  const bo = e.target.closest("[data-bulk-on]");
  if (bo && S.bulk) { S.bulk.items[+bo.dataset.bulkOn].on = bo.checked; return renderProjects(); }
  const it = e.target.closest(".item");
  if (!it) return;
  e.target.checked ? picked(S.sub).add(it.dataset.path) : picked(S.sub).delete(it.dataset.path);
  selectionChanged();
});
document.addEventListener("input", e => {
  const bn = e.target.closest("[data-bulk-name]");
  if (bn && S.bulk) S.bulk.items[+bn.dataset.bulkName].name = bn.value;
});

/* drag and drop onto the Convert tab (anywhere on the page) */
let dragDepth = 0;
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragenter", e => { if (!isFileDrag(e)) return; e.preventDefault(); dragDepth++; $("#drop")?.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!isFileDrag(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop")?.classList.remove("over"); } });
document.addEventListener("dragover", e => { if (isFileDrag(e)) e.preventDefault(); });
document.addEventListener("drop", e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  dragDepth = 0; $("#drop")?.classList.remove("over");
  if (S.view !== "convert") { S.view = "convert"; store.set("view", "convert"); render(); }
  convertFiles([...e.dataTransfer.files]);
});

let qTimer;
$("#q").addEventListener("input", e => {
  S.q = e.target.value.trim().toLowerCase();
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { if (S.view === "projects" && S.proj) renderProjects(); }, 90);
});
$("#q").addEventListener("blur", () => { if (!$("#q").value) $("#search").classList.remove("open"); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return pal.open ? closePalette() : openPalette(); }
  if ((e.ctrlKey && !e.metaKey && e.key.toLowerCase() === "r") || e.key === "F5") { e.preventDefault(); return rescan(); }   // Windows/Linux; ⌘R is the Mac app's menu
  if (pal.open) {
    if (e.key === "Escape") { e.preventDefault(); return closePalette(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pal.i = Math.max(0, Math.min(pal.list.length - 1, pal.i + (e.key === "ArrowDown" ? 1 : -1))); return renderPalette(); }
    if (e.key === "Enter") { e.preventDefault(); return palGo(e); }
    return;
  }
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
  if (e.key === "/" && S.view === "projects" && !typing) { e.preventDefault(); $("#search").classList.add("open"); $("#q").focus(); }
  if (e.key === "Escape") {
    document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open"));
    if (S.pending) { S.pending = null; transition(render); return; }
    if (S.bulk && !S.bulk.running) { S.bulk = null; transition(render); return; }
    if (S.confirmSweep) { S.confirmSweep = false; renderActionbar(); return; }
    if (document.activeElement === $("#q")) { $("#q").value = ""; S.q = ""; $("#q").blur(); renderProjects(); }
  }
});

render();
loadProjects(false).then(() => transition(render)).catch(() => { $("#app").innerHTML = `<div class="empty"><b>Can't reach Radar's engine</b>Restart it from the app menu, or run python3 radar.py serve.</div>`; });
connectEvents();

</script>
</body>
</html>
